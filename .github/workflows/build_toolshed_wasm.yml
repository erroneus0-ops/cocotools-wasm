name: Build toolshed WASM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'toolshed version (e.g. 2.6.0)'
        required: false
        default: '2.6.0'
  push:
    paths:
      - 'emcc_workflow/toolshed-*/**'
      - 'wasm_builds/toolshed/**'
      - '.github/workflows/build_toolshed_wasm.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify emcc
        run: emcc --version

      - name: Build toolshed WASM
        continue-on-error: true
        id: build_step
        run: |
          set -o pipefail
          cd wasm_builds/toolshed
          bash build.sh 2>&1 | tee /tmp/toolshed_build_output.txt
          # Write version file
          TOOLSHED=$(find ../../emcc_workflow -maxdepth 1 -type d -name "toolshed-*" | sort -V | tail -1 | xargs basename)
          echo "source: $TOOLSHED" > VERSION
          echo "built: $(date -u '+%d%b%Y')" >> VERSION

      - name: Verify output
        if: steps.build_step.outcome == 'success'
        run: |
          test -s wasm_builds/toolshed/toolshed.wasm && echo "toolshed.wasm OK"
          test -s wasm_builds/toolshed/toolshed.js   && echo "toolshed.js OK"

      - name: Run smoke test
        if: steps.build_step.outcome == 'success'
        run: |
          set -o pipefail
          node wasm_builds/toolshed/smoke_test.js 2>&1 | tee /tmp/smoke_output.txt

      - name: Write build report
        if: always()
        run: |
          echo "# toolshed WASM Build Report" > wasm_builds/toolshed/BUILD_REPORT.md
          echo "" >> wasm_builds/toolshed/BUILD_REPORT.md
          echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> wasm_builds/toolshed/BUILD_REPORT.md
          echo "**Toolshed:** $(ls -d emcc_workflow/toolshed-* | sort -V | tail -1)" >> wasm_builds/toolshed/BUILD_REPORT.md
          echo "**WASM size:** $(wc -c < wasm_builds/toolshed/toolshed.wasm 2>/dev/null || echo 'build failed') bytes" >> wasm_builds/toolshed/BUILD_REPORT.md
          echo "" >> wasm_builds/toolshed/BUILD_REPORT.md
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "## Build FAILED -- full output below" >> wasm_builds/toolshed/BUILD_REPORT.md
            echo '```' >> wasm_builds/toolshed/BUILD_REPORT.md
            cat /tmp/toolshed_build_output.txt >> wasm_builds/toolshed/BUILD_REPORT.md 2>/dev/null || echo "no build output captured" >> wasm_builds/toolshed/BUILD_REPORT.md
            echo '```' >> wasm_builds/toolshed/BUILD_REPORT.md
          else
            echo "## Smoke Test Output" >> wasm_builds/toolshed/BUILD_REPORT.md
            echo '```' >> wasm_builds/toolshed/BUILD_REPORT.md
            cat /tmp/smoke_output.txt >> wasm_builds/toolshed/BUILD_REPORT.md 2>/dev/null || echo "smoke test did not run" >> wasm_builds/toolshed/BUILD_REPORT.md
            echo '```' >> wasm_builds/toolshed/BUILD_REPORT.md
          fi

      - name: Commit WASM output
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add wasm_builds/toolshed/toolshed.js wasm_builds/toolshed/toolshed.wasm wasm_builds/toolshed/BUILD_REPORT.md wasm_builds/toolshed/VERSION
          git diff --staged --quiet || git commit -m "build: toolshed ${{ github.event.inputs.version || '2.6.0' }} WASM [ci skip]"
          git pull --rebase origin main
          git push

      - name: Fail the job if the build actually failed
        if: steps.build_step.outcome != 'success'
        run: exit 1
